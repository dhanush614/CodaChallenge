<div class="container-fluid">
	<div class="row vh-100">
		<div class="col-2 left-col-bgc">
			<div class="container-fluid">
				<div class="row">
					<img src="assets/dice.png" class="img-fluid mx-auto d-block"
						alt="Dice image">
				</div>
				<div class="row">
					<img src="assets/line.png" class="img-fluid mx-auto d-block"
						alt="Line image">
				</div>
				<div class="row">
					<p class="h6 text-secondary">Playing 9</p>
				</div>
			</div>
		</div>
		<div class="col-10 right-col-bgc">
			<div class="container-fluid">
				<div class="row">
					<div class="py-4">
						<form action="#">
							<div class="input-group">
								<div class="input-group-append">
									<button id="button-addon1" type="submit"
										class="btn btn-light border-0 rounded-pill bg-transparent">
										<i class="fas fa-search fa-sm"></i>
									</button>
								</div>
								<input type="search" placeholder="Search Players"
									aria-describedby="button-addon1"
									class="form-control bg-transparent text-secondary border-0">
							</div>
						</form>
					</div>
				</div>
			</div>
			<div class="container-fluid">
				<div class="row">
					<table class="table table-responsive w-100 d-block d-md-table">
						<thead>
							<tr>
								<th>SELECT</th>
								<th>PLAYER NAME</th>
								<th>LEVEL</th>
								<th>AVATAR</th>
								<th>BET</th>
								<th>WINS</th>
								<th>LOST</th>
								<th>PRICE</th>
							</tr>
						</thead>
						<tbody>
							<tr *ngFor="let bet of betsList">
								<th>1</th>
								<th>{{bet.Name}}</th>
								<th>2</th>
								<td><img class="img-thumbnail border-0" style="width: 25%;"
									src='{{bet["Profile Image"]}}'></td>
								<td>{{bet.Bet}}</td>
								<td>1</td>
								<td>2</td>
								<td>{{bet.Price}}</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
	<router-outlet></router-outlet>
</div>
